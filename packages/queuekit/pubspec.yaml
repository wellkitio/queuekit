name: queuekit
description: >-
  A persistent task queue for Dart and Flutter. Runs events in order, retries failures, keeps
  dependent events in order and restores the queue across app restarts.
version: 1.0.0
repository: https://github.com/wellkitio/queuekit
issue_tracker: https://github.com/wellkitio/queuekit/issues
topics:
  - queue
  - task-queue
  - persistence
  - retry
  - offline

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  meta: ^1.17.0
  state_notifier: ^1.0.0

dev_dependencies:
  lint: ^2.12.0
  test: ^1.31.1
