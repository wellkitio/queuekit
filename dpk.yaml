version: ^1.0.0

workspace:
  - packages/*
  - packages/*/example

catalog:
  environment:
    sdk: ^3.11.0
  resolution: workspace

scripts:
  analyze:
    command: dart analyze
    description: Analyze all packages
    run_in_packages:
      - packages/*
  format:
    command: dart format .
    description: Format all packages
    run_in_packages:
      - packages/*
  test:
    command: dart test
    description: Run tests in all packages
    run_in_packages:
      - packages/*
